[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastoidc"
version = "0.4.0"
description = "OIDC/OAuth2 authentication library for FastAPI with PKCE and Redis session management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Guilherme Torres" },
]
keywords = ["fastapi", "oidc", "oauth2", "authentication", "pkce", "redis", "session"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
]

[project.urls]
Repository = "https://github.com/guilherme-torres/fastoidc"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastoidc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
